<div class="border" [ngClass]="{'border-enabled': !disabled}" fxLayout="row" fxLayoutAlign="start top">
    <ilpn-symbol-square  class="square" [disabled]='disabled' [fileDisplay]="fileDisplay" [squareContent]="squareContent"></ilpn-symbol-square>
    <div class="description" fxLayout="column" fxLayoutAlign="top center" fxFlex>
        <span>{{title}}</span>
        <hr class="width100">
        <span class="description-min-height" [ngStyle]="{'height': resolveDescriptionHeight()}">{{description}}</span>
    </div>
</div>
