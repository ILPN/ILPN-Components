<div fxLayout="column" fxLayoutAlign="start center" class="bottom-margin">
    <span [class.hidden]="!showText || disabled">{{descriptionText}}</span>
    <ilpn-symbol-square large
                        [hover]="isHovered && !disabled"
                        [class.disabled]="disabled"
                        [fileDisplay]="fileDisplay"
                        [squareContent]="squareContent"
                        [bold]="bold"
                        (click)="download()"
                        (mouseenter)="hoverStart($event)"
                        (mouseleave)="hoverEnd($event)">
    </ilpn-symbol-square>
</div>
